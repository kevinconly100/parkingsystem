<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartPark – Rubavu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background-color: #0a0a0a;
      color: #e5e5e5;
    }
    .neon {
      box-shadow: 0 0 6px #0ff, 0 0 10px #0ff;
      border: 1px solid blue;
    }
    .neon-glow {
      text-shadow: 0 0 8px #0ff, 0 0 12px #0ff;
      color: #0ff;
    }
    .btn {
      transition: all 0.3s ease;
    }
    .btn:hover {
      box-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
    }
    input, input:focus, input:active {
      background: #18181b !important;
      color: #e5e5e5 !important;
      border: 1px solid #0ff;
      outline: none;
      transition: background 0.3s, color 0.3s;
    }
    input::placeholder {
      color: #7dd3fc !important;
      opacity: 1;
    }
    .light-mode input, .light-mode input:focus, .light-mode input:active {
      background: #fff !important;
      color: #18181b !important;
      border: 1px solid #1e40af;
    }
    .light-mode input::placeholder {
      color: #60a5fa !important;
      opacity: 1;
    }
    .light-mode {
      background-color: #f9fafb;
      color: #111827;
    }
    .light-mode .neon {
      border-color: #1e40af;
      box-shadow: 0 0 4px #60a5fa;
      color: #1e40af;
    }
    .light-mode .neon-glow {
      color: #1e40af;
      text-shadow: 0 0 6px #60a5fa;
    }
    .light-mode .bg-gray-900,
    .light-mode .bg-gray-800 {
      background-color: #fff !important;
    }
    .light-mode .divide-gray-700,
    .light-mode .divide-gray-800 {
      border-color: #e5e7eb !important;
    }
    .light-mode table,
    .light-mode th,
    .light-mode td {
      background-color: #fff !important;
      color: #111827 !important;
    }
  </style>
</head>
<body class="min-h-screen p-2 sm:p-4 md:p-6 transition-all">

  <!-- Theme toggle -->
  <button id="themeToggle" class="fixed top-2 right-2 sm:top-4 sm:right-6 px-3 sm:px-4 py-2 neon rounded-full text-xs sm:text-sm font-semibold btn z-50">
    Toggle Theme
  </button>

  <h1 class="text-2xl sm:text-3xl md:text-5xl text-center neon-glow mb-4 sm:mb-6">SmartPark </h1>

  <div class="max-w-full sm:max-w-2xl md:max-w-4xl mx-auto bg-gray-900 p-2 sm:p-4 md:p-6 rounded-xl shadow-lg space-y-4 sm:space-y-6 neon">

    <!-- Inputs -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-2 sm:gap-4">
      <input id="plateNumberInput" class="p-2 sm:p-3 neon rounded-md w-full" placeholder="Plate Number (e.g., RAC123A)" />
      <input id="slotNumberInput" class="p-2 sm:p-3 neon rounded-md w-full" placeholder="Slot No. (1–15)" type="number" min="1" max="15" />
      <div class="flex flex-col sm:flex-row gap-2">
        <button id="parkButton" class="w-full bg-green-700 text-white p-2 sm:p-3 rounded-md font-semibold btn">Park</button>
        <button id="removeButton" class="w-full bg-red-700 text-white p-2 sm:p-3 rounded-md font-semibold btn">Remove</button>
      </div>
    </div>

    <!-- Clear button -->
    <button id="clearAllButton" class="w-full bg-yellow-500 text-black p-2 sm:p-3 rounded-md font-semibold btn">Clear All</button>

    <!-- Status Message -->
    <div id="statusMessage" class="text-center text-base sm:text-lg font-medium"></div>

    <!-- Table -->
    <div class="overflow-x-auto hidden" id="carsTableWrapper">
      <table class="min-w-[400px] sm:min-w-full divide-y divide-gray-700 text-xs sm:text-sm">
        <thead class="bg-gray-800">
          <tr>
            <th class="px-2 sm:px-6 py-2 sm:py-3">Slot</th>
            <th class="px-2 sm:px-6 py-2 sm:py-3">Plate</th>
            <th class="px-2 sm:px-6 py-2 sm:py-3">Entry Time</th>
            <th class="px-2 sm:px-6 py-2 sm:py-3">Duration</th>
          </tr>
        </thead>
        <tbody id="parkedCarsTable" class="bg-gray-900 divide-y divide-gray-800"></tbody>
      </table>
    </div>

    <!-- Empty Message -->
    <div id="emptyTableMessage" class="text-center text-gray-500 py-4 sm:py-6 text-sm sm:text-base">No cars parked currently.</div>

    <!-- Count -->
    <div class="text-right font-bold text-xs sm:text-base">Parked: <span id="parkedCount">0</span> / 15</div>

  </div>

  <script src="script.js"></script>
  <script>
    // Theme toggle logic
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    function setTheme(isLight) {
      if (isLight) {
        body.classList.add('light-mode');
        themeToggle.textContent = 'Dark Mode';
        localStorage.setItem('theme', 'light');
      } else {
        body.classList.remove('light-mode');
        themeToggle.textContent = 'Light Mode';
        localStorage.setItem('theme', 'dark');
      }
    }
    // On load, restore theme
    (() => {
      const saved = localStorage.getItem('theme');
      setTheme(saved === 'light');
    })();
    themeToggle.addEventListener('click', () => {
      setTheme(!body.classList.contains('light-mode'));
    });
  </script>
</body>
</html>
